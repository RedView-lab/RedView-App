# /etc/systemd/journald@brouter.conf — journal à part de BRouter (LogNamespace=brouter).
#
# Le jar officiel écrit une ligne par requête, coordonnées de l'itinéraire
# comprises (`lonlats=…`), sans réglage pour la couper : dans le journal
# système, 14 515 itinéraires étaient gardés 30 jours (2026-10-07). Ici, 48 h
# au plus : assez pour les durées de calcul sur 24 h de
# scripts/vps-perf-snapshot.sh et un diagnostic, pas un historique des trajets.
# Fichiers tournés chaque jour pour que la rétention s'applique vraiment
# (journald ne supprime que des fichiers archivés entiers).
[Journal]
Storage=persistent
SystemMaxUse=200M
MaxFileSec=1day
MaxRetentionSec=2day
