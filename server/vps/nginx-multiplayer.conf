# Serveur temps réel de co-édition derrière l'nginx de l'hôte
# (/etc/nginx/conf.d/app.conf, bloc `server` de app.redview.tech).
#
# Zones (contexte http : en tête de app.conf, hors du bloc server) : une IP
# ouvre au plus 32 connexions WebSocket simultanées et 10 ouvertures/s (rafale
# 40) — en plus des plafonds du serveur lui-même (server/multiplayer/server.ts),
# l'nginx coupe une inondation avant qu'elle n'atteigne Node.
limit_conn_zone $binary_remote_addr zone=multiplayer_conn:10m;
limit_req_zone $binary_remote_addr zone=multiplayer_req:10m rate=10r/s;

# Dans le bloc `server` de app.redview.tech (remplace l'ancien `location /multiplayer`,
# qui attrapait aussi `/multiplayerX`).
location = /multiplayer {
    limit_conn multiplayer_conn 32;
    limit_req zone=multiplayer_req burst=40 nodelay;
    limit_conn_status 429;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:17790;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location /multiplayer/ {
    limit_conn multiplayer_conn 32;
    limit_req zone=multiplayer_req burst=40 nodelay;
    limit_conn_status 429;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:17790;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
