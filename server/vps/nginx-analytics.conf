# /etc/nginx/conf.d/analytics.conf — tableau de bord Umami (analytics.redview.tech).
# Le traceur et la collecte passent par app.redview.tech (nginx-stats.conf) ;
# ce domaine ne sert que l'interface et l'API d'Umami (clé API : MCP,
# npm run analytics:sync).
#
# Umami n'a ni double authentification ni verrouillage après des échecs : la
# connexion est limitée ici à 5 essais par minute et par IP (rafale 5, puis
# 429). Le reste de l'API (Bearer, tableaux de bord) n'est pas limité.
limit_req_zone $binary_remote_addr zone=umami_login:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name analytics.redview.tech analytics.141.145.220.99.sslip.io;
    return 301 https://analytics.redview.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name analytics.redview.tech;

    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/redview.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redview.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;

    # proxy_set_header n'est hérité que si la location n'en pose aucun : la
    # liste complète est répétée dans chaque location (X-Real-IP = IP vue par
    # Umami, CLIENT_IP_HEADER).
    location = /api/auth/login {
        limit_req zone=umami_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
