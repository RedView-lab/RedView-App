# Frontale d'Appwrite (appwrite.redview.tech) : /etc/nginx/conf.d/appwrite.conf
# (fichier entier). nginx termine le TLS public puis relaie à l'entrée HTTPS du
# Traefik d'Appwrite (127.0.0.1:8444).
#
# Connexions persistantes vers Traefik (2026-10-08) : avant, chaque requête
# Appwrite ouvrait une connexion TLS neuve vers Traefik (`Connection "upgrade"`
# forcé, pas de bloc upstream) — 15 ms de poignée de main mesurés sur le VPS
# contre 3,4 ms pour une requête sur une connexion réutilisée, plus le CPU de
# la négociation des deux côtés, à chaque appel du SDK. Le pool `keepalive`
# garde jusqu'à 32 connexions ouvertes par processus nginx ; `Connection` ne
# vaut `upgrade` que pour une vraie demande WebSocket (Realtime de la console).
#
# Appliquer : sauvegarde horodatée, `install -m 644` + `restorecon`, `nginx -t`,
# `systemctl reload nginx` (connexions en cours gardées).
# Retour arrière : remettre la sauvegarde, `nginx -t`, `systemctl reload nginx`.

upstream appwrite_traefik {
    server 127.0.0.1:8444;
    keepalive 32;
    keepalive_timeout 60s;
}

map $http_upgrade $appwrite_connection {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name appwrite.redview.tech appwrite.141.145.220.99.sslip.io;
    return 301 https://appwrite.redview.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name appwrite.redview.tech;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/redview.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redview.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass https://appwrite_traefik;
        proxy_ssl_verify off;
        proxy_ssl_session_reuse on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $appwrite_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
