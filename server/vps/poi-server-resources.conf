# /etc/systemd/system/poi-server.service.d/resources.conf
# Base SQLite en lecture seule lue par mmap (server/poi-server/db.js) : son page
# cache (~470 Mo) est compté dans le cgroup du service, d'où une limite au-dessus
# (une limite plus basse le ferait évincer, pas tuer le service).
# En cas de manque de mémoire, le noyau sacrifie un build Coolify plutôt que les POI.
[Service]
MemoryMax=1G
OOMScoreAdjust=-100
