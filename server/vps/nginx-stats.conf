# Mesure d'audience first-party : le tracker Umami et sa collecte servis par
# app.redview.tech (/etc/nginx/conf.d/app.conf, bloc `server` de
# app.redview.tech), pas par analytics.redview.tech — même origine que l'app
# (CSP `'self'`, pas d'origine tierce que les listes de blocage visent).
# Deux chemins exacts seulement : le tableau de bord et le reste de l'API
# Umami ne sont jamais joignables par le domaine de l'app. Plan de mesure et
# règles de vie privée : docs/analytics/measurement.md.
#
# Zone (contexte http : en tête de app.conf, hors du bloc server) : 20
# envois/s par IP (rafale 60) — un onglet en envoie quelques-uns par minute.
limit_req_zone $binary_remote_addr zone=stats_req:10m rate=20r/s;

# Dans le bloc `server` de app.redview.tech.
location = /s/x.js {
    proxy_pass http://127.0.0.1:3005/script.js;
    proxy_http_version 1.1;
    proxy_set_header Host analytics.redview.tech;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=3600" always;
    proxy_read_timeout 15s;
}

location = /s/api/send {
    limit_req zone=stats_req burst=60 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:3005/api/send;
    proxy_http_version 1.1;
    proxy_set_header Host analytics.redview.tech;
    # Umami lit l'IP dans X-Real-IP seulement (CLIENT_IP_HEADER, compose) :
    # réécrite ici avec l'adresse vue par nginx, une valeur fournie par le
    # client (X-Forwarded-For, CF-Connecting-IP…) ne compte pas. Elle sert au
    # hash de session (sel mensuel) et à la ville, jamais stockée en clair.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;
}
