# /etc/systemd/journald.conf.d/90-redview.conf
# Sans /var/log/journal, journald gardait tout dans /run (tmpfs, donc en RAM) :
# 458 Mo mesurés le 2026-10-05. Journal sur disque, borné ; /run ne sert plus
# qu'au tout début du démarrage.
[Journal]
Storage=persistent
SystemMaxUse=300M
SystemKeepFree=2G
RuntimeMaxUse=32M
MaxRetentionSec=30day
