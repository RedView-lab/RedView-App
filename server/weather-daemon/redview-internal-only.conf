# Sources autorisées pour les services internes (BRouter / POI / météo).
# À installer dans /etc/nginx/redview-internal-only.conf (hors conf.d).
#
# L'app (conteneur Coolify sur ce même VPS) les appelle via
# BROUTER_UPSTREAM / POI_UPSTREAM / WEATHER_UPSTREAM. Selon la route réseau,
# nginx voit comme source : loopback, la passerelle d'un réseau Docker, l'IP
# privée de la VNIC Oracle, ou l'IP publique (hairpin NAT). Tout le reste est
# refusé.
allow 127.0.0.1;
allow ::1;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow 141.145.220.99;
deny all;
