# RedView Weather - Nginx configuration snippet for Oracle VPS (141.145.220.99)
# Place in /etc/nginx/conf.d/redview-weather.conf or inside existing server block

location /weather/ {
    alias /var/www/weather/;
    index meta.json;
    autoindex off;

    # CORS headers for web clients
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Accept, Content-Type, Range' always;

    # Cache static raster tiles for 30 minutes
    location ~* \.(webp|png)$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=1800, stale-while-revalidate=3600" always;
        add_header X-Weather-Source "redview-vps-oracle" always;
    }

    # Cache metadata for 5 minutes
    location ~* meta\.json$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=600" always;
        add_header X-Weather-Source "redview-vps-oracle" always;
    }

    if ($request_method = 'OPTIONS') {
        return 204;
    }
}
