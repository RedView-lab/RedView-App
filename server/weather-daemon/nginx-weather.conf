# Météo RedView - extrait de configuration nginx pour le VPS Oracle (141.145.220.99)
# À placer dans /etc/nginx/conf.d/redview-weather.conf ou dans un bloc server existant

location /weather/ {
    alias /var/www/weather/;
    index meta.json;
    autoindex off;

    # En-têtes CORS pour les clients web
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Accept, Content-Type, Range' always;

    # Met en cache les tuiles raster statiques 30 minutes
    location ~* \.(webp|png)$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=1800, stale-while-revalidate=3600" always;
        add_header X-Weather-Source "redview-vps-oracle" always;
    }

    # Met en cache les métadonnées 5 minutes
    location ~* meta\.json$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "public, max-age=300, stale-while-revalidate=600" always;
        add_header X-Weather-Source "redview-vps-oracle" always;
    }

    if ($request_method = 'OPTIONS') {
        return 204;
    }
}
