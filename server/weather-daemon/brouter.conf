# Serveur nginx par défaut du VPS (port 80, accès par IP).
#
# Sécurité :
#   - /brouter, /poi/ et /weather/ ne sont appelés que côté serveur par l'app
#     (api/brouter.ts, api/poi.ts, api/weather.ts — conteneur Coolify sur ce
#     même hôte). Ils sont donc restreints aux sources locales / Docker : le
#     public ne peut plus contourner le rate limiting et la validation de l'app.
#   - Coolify n'est PLUS publié ici (il était exposé en HTTP clair sur l'IP
#     publique). Accès admin uniquement par tunnel SSH :
#       ssh -i ~/.ssh/oracle_brouter.key -L 8000:127.0.0.1:8000 -L 6001:127.0.0.1:6001 -L 6002:127.0.0.1:6002 opc@141.145.220.99
#     puis http://localhost:8000
#
# Ce fichier est inclus au niveau `http {}` (conf.d) : les directives
# http-level ci-dessous s'appliquent à tout nginx.

server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Les profils BRF uploadés font < 512 Ko (plafond côté app).
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 1. BRouter Standalone (Port 17777)
    location /brouter {
        include /etc/nginx/redview-internal-only.conf;

        proxy_pass http://127.0.0.1:17777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # 2. RedView POI Server (Port 17778)
    location /poi/ {
        include /etc/nginx/redview-internal-only.conf;

        proxy_pass http://127.0.0.1:17778/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 3. RedView Weather Server / Tiles (Direct zero-copy static cache)
    location /weather/ {
        include /etc/nginx/redview-internal-only.conf;

        alias /var/www/weather/;
        autoindex off;
        add_header Cache-Control "public, max-age=1800, stale-while-revalidate=3600" always;
        add_header X-Weather-Source "oracle-vps" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # 4. Open-Meteo auto-hébergé (127.0.0.1:8080, server/vps/open-meteo) :
    #    prévisions et historique de l'app (OPENMETEO_UPSTREAM=http://<ip>/openmeteo).
    location /openmeteo/ {
        include /etc/nginx/redview-internal-only.conf;

        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 5. Tout le reste (dont l'ancien proxy Coolify) : fermé.
    location / {
        return 404;
    }
}
