<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiDAR HD — RedView Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 30, 0.92);
      z-index: 100;
      transition: opacity 0.3s;
    }
    #overlay.hidden { opacity: 0; pointer-events: none; }
    #overlay h1 {
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 1.5rem;
      margin-bottom: 1.5rem;
    }
    #status {
      color: #ccc;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }
    .bar {
      width: 300px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }
    #bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      border-radius: 3px;
      transition: width 0.3s;
    }
    #stats {
      position: fixed;
      bottom: 8px;
      left: 8px;
      color: rgba(255,255,255,0.8);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12px;
      z-index: 50;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    #controls {
      position: fixed;
      top: 8px;
      right: 8px;
      color: rgba(255,255,255,0.5);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      z-index: 50;
      text-align: right;
      line-height: 1.6;
      pointer-events: none;
    }
    #watermark {
      position: fixed;
      bottom: 8px;
      right: 8px;
      color: rgba(255,255,255,0.25);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      z-index: 50;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="overlay">
    <h1>🛰️ LiDAR HD Viewer</h1>
    <div id="status">Initialisation...</div>
    <div class="bar"><div id="bar-fill"></div></div>
  </div>

  <div id="stats"></div>
  <div id="controls">
    LMB : Orbite · RMB : Pan · Scroll : Zoom<br/>
    +/- : Taille · T : Terrain · L : LOD · Q : Stats · N : Neige
  </div>
  <div id="watermark">RedView LiDAR HD</div>

  <script type="module" src="/src/features/lidar/viewer/main.ts"></script>
</body>
</html>
