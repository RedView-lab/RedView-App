<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiDAR HD — RedView Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #stats {
      position: fixed;
      bottom: 8px;
      left: 8px;
      color: rgba(255,255,255,0.8);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12px;
      z-index: 50;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    #controls {
      position: fixed;
      top: 8px;
      right: 8px;
      color: rgba(255,255,255,0.5);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      z-index: 50;
      text-align: right;
      line-height: 1.6;
      pointer-events: none;
    }
    #watermark {
      position: fixed;
      bottom: 8px;
      right: 8px;
      color: rgba(255,255,255,0.25);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      z-index: 50;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="overlay"></div>

  <div id="stats"></div>
  <div id="controls">
    LMB : Orbite · RMB : Pan · Scroll : Zoom<br/>
    +/- : Taille · T : Terrain · L : LOD · Q : Stats · N : Neige
  </div>
  <div id="watermark">RedView LiDAR HD</div>

  <script type="module" src="/src/features/lidar/viewer/main.ts"></script>
</body>
</html>
