<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=redview1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=redview1" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=redview1" />
  <title>LiDAR HD — RedView Viewer</title>
  <!-- Rethink Sans — the app's only font (token --rv-font-sans). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600;1,700;1,800&display=swap"
  />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #stats {
      position: fixed;
      bottom: 8px;
      left: 8px;
      color: rgba(255,255,255,0.8);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 12px;
      z-index: 50;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      pointer-events: none;
    }
    #controls {
      position: fixed;
      bottom: 28px;
      left: 8px;
      color: rgba(255,255,255,0.5);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      z-index: 50;
      text-align: left;
      line-height: 1.6;
      pointer-events: none;
    }
    #watermark {
      position: fixed;
      bottom: 8px;
      right: 8px;
      color: rgba(255,255,255,0.25);
      font-family: system-ui, sans-serif;
      font-size: 11px;
      z-index: 50;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="overlay"></div>

  <div id="stats"></div>
  <div id="controls">
    LMB : Orbite · RMB : Pan · Scroll : Zoom<br/>
    +/- : Taille · T : Terrain · L : LOD · Q : Stats · N : Neige<br/>
    Clic droit : Menu · O : Vue 360° · M : Distance · H : Dénivelé · S : Surface · P : Profil · F : Ligne de pente · A : Avalanche · V : Zones visibles
  </div>
  <div id="watermark">RedView LiDAR HD</div>

  <script type="module" src="/src/features/lidar/viewer/main.ts"></script>
</body>
</html>
