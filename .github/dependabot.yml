# Mises à jour de dépendances : une PR groupée par semaine pour les mineures
# et correctifs, une PR par version majeure (à lire : changements cassants).
# Chaque PR passe la CI (check:full) ; rien n'est fusionné ni déployé seul.
# Les alertes de sécurité (Dependabot alerts / security updates) s'activent
# dans Settings → Code security du dépôt.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Mapbox GL JS à part : l'app utilise des API privées (version épinglée,
      # garde dans src/features/map3d/lib/mapboxInternals.test.ts) ; chaque
      # montée se relit seule, carte affichée.
      carte-mapbox:
        patterns: ["mapbox-gl", "@mapbox/*"]
      dependencies-mineures:
        dependency-type: production
        update-types: [minor, patch]
      outils-mineurs:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Facturation gelée (décision produit) : aucune montée de version Stripe
      # tant que le gel n'est pas levé.
      - dependency-name: stripe
      - dependency-name: "@stripe/*"
      # SDK Appwrite épinglés sur la série du serveur de prod (1.6 : node-appwrite
      # 16, appwrite 17) ; une montée suit celle du serveur
      # (docs/operations/appwrite-sdk.md).
      - dependency-name: node-appwrite
        update-types: ["version-update:semver-major"]
      - dependency-name: appwrite
        update-types: ["version-update:semver-major"]

  # Image de base node:22-alpine épinglée par digest dans les deux Dockerfile :
  # une PR par nouveau digest (correctifs d'Alpine et de Node 22). Une montée
  # de Node (24…) se décide à part.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: chore(docker)
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      image-node:
        patterns: ["node"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
