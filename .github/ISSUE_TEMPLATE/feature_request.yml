name: Proposer une amélioration
description: Suggérer une amélioration ou une nouvelle possibilité.
title: "[Idée] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Le problème
      description: Qu'essayez-vous de faire, et qu'est-ce qui vous en empêche aujourd'hui ?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Ce que vous aimeriez
      description: Comment cela pourrait fonctionner. Croquis et exemples tirés d'autres outils bienvenus.
    validations:
      required: true

  - type: dropdown
    id: activity
    attributes:
      label: Pour quelle activité
      multiple: true
      options:
        - Ultra-cyclisme / route
        - Bikepacking / gravel
        - Trail / randonnée
        - Montagne / ski de randonnée
        - Toutes

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives (facultatif)
      description: Solutions de contournement utilisées aujourd'hui, ou autres options envisagées.
