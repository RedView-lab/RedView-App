name: Signaler un bogue
description: Quelque chose dans RedView ne fonctionne pas comme prévu.
title: "[Bogue] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de le signaler. **Ne collez aucune donnée personnelle** :
        pas d'adresse e-mail, pas de nom de projet, pas de coordonnées exactes de domicile, pas de lien de réinitialisation.

  - type: dropdown
    id: area
    attributes:
      label: Domaine
      options:
        - Carte 3D et surcouches (pentes, altitude, météo, neige, ensoleillement)
        - Routage et édition d'itinéraire
        - Prédiction du temps en mouvement et horaire
        - POI et roadbook
        - Visualiseur LiDAR
        - Co-édition, commentaires, présence en direct
        - Gestionnaire de projets, compte, partage
        - Export (GPX, FIT, .redview, vidéo de survol)
        - Autre
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: Ce qui s'est passé
      description: Ce que vous avez vu, et ce que vous attendiez à la place.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir un projet avec …
        2. Cliquer sur …
        3. Constater …
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Navigateur et système
      placeholder: p. ex. Chrome 141 sous Windows 11, Firefox sous Ubuntu, Safari sous macOS
    validations:
      required: true

  - type: input
    id: request-id
    attributes:
      label: Identifiant de requête ou heure de l'erreur (facultatif)
      description: Un `X-Request-ID` relevé dans l'onglet réseau du navigateur, ou l'heure de l'erreur, aide à retrouver le journal du serveur.

  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran ou sortie de la console (facultatif)
