# Même gate que `npm run deploy` (scripts/quality/check.mjs --full) : types, lint,
# tests unitaires, knip, cycles, build de prod, régressions hors ligne.
# Le déploiement reste manuel ; la CI donne le verdict sur chaque push et PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions épinglées par SHA de commit (le tag est en commentaire, Dependabot
# les met à jour) : un tag déplacé ne change pas ce qui tourne ici.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Comme l'image de prod (Dockerfile : node:22-alpine).
          node-version: 22
          cache: npm

      - run: npm ci

      # Caches des outils incrémentaux, restaurés après `npm ci` (qui vide
      # node_modules) : build info de tsc -b et cache ESLint (stratégie
      # « content » : un checkout remet toutes les dates à zéro). À froid ils
      # coûtent ~55 s et ~87 s des étapes parallèles ; seuls les fichiers
      # modifiés depuis le run en cache sont revérifiés. Clé par commit,
      # restauration depuis le plus récent.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules/.tmp
            node_modules/.cache/eslint
          key: check-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'eslint.config.js', 'eslint-suppressions.json') }}-${{ github.sha }}
          restore-keys: |
            check-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'eslint.config.js', 'eslint-suppressions.json') }}-

      # Chromium de Playwright : l'E2E du parcours principal (script-test-bench/user-journey,
      # étape `journey` de check:full) tourne sur le build de prod, sans jeton Mapbox.
      - run: npx playwright install --with-deps chromium

      - run: npm run check:full

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: user-journey
          path: script-test-bench/reports/user-journey/

  # Viewer LiDAR sous Linux, comme ses utilisateurs : Firefox n'y a pas
  # WebGPU et Chrome ne l'active que sur certains GPU, le viewer tourne donc
  # en WebGL 2 (ici sans GPU : SwiftShader et llvmpipe). Tuile synthétique,
  # aucun réseau extérieur (script-test-bench/lidar-viewer-engines).
  viewer-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox

      # Un vrai serveur X et Mesa (llvmpipe) : Firefox headless n'a aucun
      # pilote GL sur le runner (« Exhausted GL driver options »), alors
      # qu'un bureau Linux lui donne celui du système.
      - run: sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl-mesa0 libegl1

      - run: npm run build:vite

      # Les deux navigateurs choisissent WebGL 2 ici : les cas « webgl »
      # forcés, même chemin, sont sautés (≈ 165 s de SwiftShader en moins).
      - run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run bench:lidar-engines -- --expect-auto webgl --headed

      # Moteur de Safari (WebGL 2, pas de WebGPU dans Playwright) : 21/21 sous
      # Windows ; non bloquant tant qu'il n'a pas été vu vert sur ce runner.
      - run: npx playwright install --with-deps webkit
        continue-on-error: true
      - run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run bench:lidar-engines -- --browsers webkit --expect-auto webgl --headed
        continue-on-error: true

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lidar-viewer-engines
          path: script-test-bench/reports/lidar-viewer-engines/

  # Aucun secret dans l'historique git : gitleaks (règles par défaut) sur
  # tous les commits, binaire épinglé et vérifié par SHA-256 (l'action
  # officielle exige une licence pour un dépôt d'organisation). Faux positifs
  # déclarés un par un dans .gitleaksignore. Une clé trouvée ici est à
  # révoquer chez son fournisseur : la retirer du code ne suffit pas.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git . --redact --no-banner --exit-code 1
