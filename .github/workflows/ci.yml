# Même gate que `npm run deploy` (scripts/check.mjs --full) : types, lint,
# tests unitaires, knip, cycles, build de prod, régressions hors ligne.
# Le déploiement reste manuel ; la CI donne le verdict sur chaque push et PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Comme l'image de prod (Dockerfile : node:22-alpine).
          node-version: 22
          cache: npm

      - run: npm ci

      # Caches des outils incrémentaux, restaurés après `npm ci` (qui vide
      # node_modules) : build info de tsc -b et cache ESLint (stratégie
      # « content » : un checkout remet toutes les dates à zéro). À froid ils
      # coûtent ~55 s et ~87 s des étapes parallèles ; seuls les fichiers
      # modifiés depuis le run en cache sont revérifiés. Clé par commit,
      # restauration depuis le plus récent.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.tmp
            node_modules/.cache/eslint
          key: check-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'eslint.config.js', 'eslint-suppressions.json') }}-${{ github.sha }}
          restore-keys: |
            check-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'eslint.config.js', 'eslint-suppressions.json') }}-

      - run: npm run check:full

  # Viewer LiDAR sous Linux, comme ses utilisateurs : Firefox n'y a pas
  # WebGPU et Chrome ne l'active que sur certains GPU, le viewer tourne donc
  # en WebGL 2 (ici sans GPU : SwiftShader et llvmpipe). Tuile synthétique,
  # aucun réseau extérieur (script-test-bench/lidar-viewer-engines).
  viewer-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium firefox

      # Un vrai serveur X et Mesa (llvmpipe) : Firefox headless n'a aucun
      # pilote GL sur le runner (« Exhausted GL driver options »), alors
      # qu'un bureau Linux lui donne celui du système.
      - run: sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl-mesa0 libegl1

      - run: npm run build:vite

      # Les deux navigateurs choisissent WebGL 2 ici : les cas « webgl »
      # forcés, même chemin, sont sautés (≈ 165 s de SwiftShader en moins).
      - run: xvfb-run -a --server-args="-screen 0 1920x1080x24" npm run bench:lidar-engines -- --expect-auto webgl --headed

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lidar-viewer-engines
          path: script-test-bench/reports/lidar-viewer-engines/
