        <!-- Préchauffage des origines de tuiles. Chaque preconnect économise la
             poignée de main DNS + TCP + TLS à froid (~150–400 ms, une fois) sur la
             PREMIÈRE tuile récupérée depuis cette origine — multiplié par
             France / Espagne / Norvège / Suisse / AWS au démarrage, c'est le plus
             gros gain de premier affichage sur la fibre (où le goulot est
             l'aller-retour réseau, pas le débit). Toutes les origines ci-dessous
             sont des CDN publics avec CORS déjà utilisés par le pipeline DEM du
             SW. crossorigin est nécessaire pour que la connexion préchauffée soit
             vraiment réutilisée par `fetch(..., {mode:'cors'})` (le défaut du SW).-->
        <link rel="dns-prefetch" href="https://api.mapbox.com" />
        <link rel="preconnect" href="https://api.mapbox.com" crossorigin />
        <link rel="dns-prefetch" href="https://data.geopf.fr" />
        <link rel="preconnect" href="https://data.geopf.fr" crossorigin />
        <link rel="dns-prefetch" href="https://data.geo.admin.ch" />
        <link rel="preconnect" href="https://data.geo.admin.ch" crossorigin />
        <link rel="dns-prefetch" href="https://servicios.idee.es" />
        <link rel="preconnect" href="https://servicios.idee.es" crossorigin />
        <link rel="dns-prefetch" href="https://hoydedata.no" />
        <link rel="preconnect" href="https://hoydedata.no" crossorigin />
        <link rel="dns-prefetch" href="https://s3.amazonaws.com" />
        <link rel="preconnect" href="https://s3.amazonaws.com" crossorigin />
    <!-- Écran de démarrage, peint avant le JS (plus de page blanche) puis repris
         tel quel par BootstrapScreen (src/App.tsx). Thème de l'OS tant que
         initAppTheme() n'a pas posé data-rv-theme, puis les jetons de l'app
         (src/shared/styles/theme.css). Styles inline : autorisés par la CSP. -->
    <style>
      .rv-boot {
        --rv-boot-paper: 14 14 18;
        --rv-boot-ink: 255 255 255;
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: rgb(var(--rv-boot-paper));
        color: rgb(var(--rv-boot-ink));
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-rv-theme]) .rv-boot {
          --rv-boot-paper: 255 255 255;
          --rv-boot-ink: 17 17 20;
        }
      }
      :root[data-rv-theme] .rv-boot {
        --rv-boot-paper: var(--rv-paper);
        --rv-boot-ink: var(--rv-ink);
      }
      .rv-boot__mark {
        width: 44px;
        height: 44px;
      }
      .rv-boot__bar {
        width: 96px;
        height: 2px;
        overflow: hidden;
        border-radius: 1px;
        background: rgb(var(--rv-boot-ink) / 0.12);
      }
      .rv-boot__bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: rgb(var(--rv-boot-ink) / 0.7);
        animation: rv-boot-slide 1.1s ease-in-out infinite;
      }
      .rv-boot__label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @keyframes rv-boot-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .rv-boot__bar::after { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
